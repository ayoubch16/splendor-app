<mat-card>
  <mat-card-header>
    <mat-card-title>
      <img src="assets/images/logos/splendorart-logo.png" alt="splendorart logo" width="250px">
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field appearance="outline">
        <mat-label>Nom d'utilisateur ou Email</mat-label>
        <input matInput formControlName="username" type="text" placeholder="Nom d'utilisateur ou Email">
        <mat-error *ngIf="f['username'].errors?.['required']">Ce champ est requis</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput formControlName="password" type="password">
        <mat-error *ngIf="f['password'].errors?.['required']">Mot de passe est requis</mat-error>
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
      </button>
    </form>
  </mat-card-content>
</mat-card>
