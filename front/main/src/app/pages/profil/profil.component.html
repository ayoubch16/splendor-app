<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">
      {{ isEditing ? 'Modifier l\'utilisateur' : 'Créer un nouvel utilisateur' }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Username*</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput formControlName="username" placeholder="Nom d'utilisateur"  readonly />
<!--            <mat-error *ngIf="userForm.get('username')?.hasError('required')">-->
<!--              Ce champ est obligatoire-->
<!--            </mat-error>-->
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Email*</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="email" formControlName="email" placeholder="Email" readonly />
          </mat-form-field>
        </div>

        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Nouveau mot de passe</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="password" placeholder="Nouveau mot de passe" />
            <button mat-icon-button matSuffix (click)="hideNewPassword = !hideNewPassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideNewPassword" type="button">
              <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="userForm.get('password')?.hasError('minlength')">
              Le mot de passe doit contenir au moins 8 caractères
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Confirmer le mot de passe</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Confirmer le mot de passe" />
            <button mat-icon-button matSuffix (click)="hideConfirmPassword = !hideConfirmPassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideConfirmPassword" type="button">
              <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="userForm.get('confirmPassword')?.hasError('passwordMismatch')">
              Les mots de passe ne correspondent pas
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Prénom</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput formControlName="first_name" placeholder="Prénom" />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Nom</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput formControlName="last_name" placeholder="Nom" />
          </mat-form-field>
        </div>
      </div>

      <div class="m-t-12">
        <button mat-flat-button color="primary" class="m-r-8" type="submit"
                [disabled]="userForm.invalid || !formHasChanges()">
          {{ isEditing ? 'Mettre à jour' : 'Créer' }}
        </button>

        <button *ngIf="isEditing" mat-stroked-button color="primary" type="button"
                (click)="resetForm()" [disabled]="!formHasChanges()">
          Annuler
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
